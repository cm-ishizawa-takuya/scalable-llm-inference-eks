# Load generator. Apply with kubectl from the repository root when you want
# to watch the autoscaler:
#   kubectl -n inference create configmap load-script --from-file=manifests/load-test/load.js
#   kubectl -n inference apply -f manifests/load-test/job.yaml
# Delete the Job to stop early. Adjust VUS and DURATION below; a second
# replica needs about 7 minutes before it serves traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
  namespace: inference
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "/scripts/load.js"]
          env:
            - name: VUS
              value: "8"
            - name: DURATION
              value: "15m"
            - name: MAX_TOKENS
              value: "256"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: load-script
