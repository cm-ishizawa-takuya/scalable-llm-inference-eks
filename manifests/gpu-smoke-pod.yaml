# Smoke test for the GPU NodePool. Requests one GPU, prints nvidia-smi, exits.
# A node is provisioned from zero when this Pod is created and removed about
# a minute after the Pod is deleted.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: nvidia-smi
      image: public.ecr.aws/docker/library/ubuntu:24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
